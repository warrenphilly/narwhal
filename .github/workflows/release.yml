name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run mac
      - uses: actions/upload-artifact@v4
        with:
          name: narwhal-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run win
      - uses: actions/upload-artifact@v4
        with:
          name: narwhal-windows
          path: dist/**/*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print -exec cp {} upload/ \;
          ls -lh upload
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          body: |
            ## Install Narwhal

            - **Mac (Apple Silicon):** download the `.dmg`, open it, drag **Narwhal** into Applications
            - **Windows:** download the `.exe` installer and run it

            First Mac open: right-click Narwhal → **Open** (unsigned build).

            Connect to your home Jellyfin server on the same network for playback.
