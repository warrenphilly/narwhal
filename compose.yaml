# Dockge / Docker Compose — run Narwhal on the same LAN as Jellyfin.
#
# Option A (paste-only): keep the GitHub build context below, Deploy in Dockge.
# Option B (clone into the stack folder): change build to `build: .` then Deploy.
#
# Open http://YOUR-SERVER-IP:3000 and sign in with Jellyfin
# (e.g. http://10.x.x.x:8096, http://host.docker.internal:8096, or http://jellyfin:8096).

services:
  narwhal:
    build:
      context: https://github.com/warrenphilly/narwhal.git#main
      dockerfile: Dockerfile
    # Local clone alternative:
    # build: .
    image: narwhal:local
    container_name: narwhal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # Lets the container reach Jellyfin on the Docker host (TrueNAS / etc.).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/auth/session').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
