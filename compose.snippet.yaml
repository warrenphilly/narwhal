# Snippet for Dockge — add under your existing `services:` (same indent as jellyfin).
#
# On the NAS first:
#   cd /mnt/tank/stacks/arr
#   git clone https://github.com/warrenphilly/narwhal.git narwhal
#
# Then Deploy the stack. Open http://10.88.111.25:3000
# Sign in to Jellyfin with: http://jellyfin:8096

  narwhal:
    build:
      context: ./narwhal
      dockerfile: Dockerfile
    image: narwhal:local
    container_name: narwhal
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
